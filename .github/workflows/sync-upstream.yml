name: "Sync upstream"

# Applies each new upstream release to this fork's main branch as one commit, checks the in-place trust patch survived, tests it, and publishes it as <upstream tag>.1 for HACS.
# No upstream commit enters the fork, so no push touches a workflow file (GITHUB_TOKEN cannot push those); a release that conflicts fails the job.
# The checkout keeps no token in .git/config, so upstream's tests and requirements never see it; the Push step authenticates through gh.

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency: sync-upstream

defaults:
  run:
    # an explicit bash adds -o pipefail
    shell: bash

env:
  UPSTREAM: Athozs/hass-additional-ca

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: "Keep the schedule enabled"
        # GitHub disables scheduled workflows after 60 days without repository activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/sync-upstream.yml/enable"

      - name: "Find the latest upstream release"
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release view --repo "$UPSTREAM" --json tagName --jq .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          pattern="^$(printf '%s' "$tag" | sed 's/\./\\./g')\.[0-9]+$"
          released=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')
          if grep -qE "$pattern" <<< "$released"; then
            echo "Upstream $tag is already released here."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Checkout"
        if: steps.upstream.outputs.new == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Apply the upstream release"
        if: steps.upstream.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName')
          if [ -z "$last" ]; then
            echo "::error::This fork has no release to take the previous upstream tag from."
            exit 1
          fi
          prev="${last%.*}"
          git fetch --no-tags "https://github.com/$UPSTREAM.git" "+refs/tags/$prev:refs/upstream-tags/$prev" "+refs/tags/$TAG:refs/upstream-tags/$TAG"
          git diff --binary "refs/upstream-tags/$prev" "refs/upstream-tags/$TAG" -- . ':(exclude).github/workflows' | git apply --3way --index --allow-empty
          if ! git diff --cached --quiet; then
            git commit -m "Sync upstream release $TAG"
          fi

      - name: "Check the in-place trust patch survived"
        if: steps.upstream.outputs.new == 'true'
        run: |
          if ! grep -q '^def load_ca_into_hass_ssl_contexts(' custom_components/additional_ca/utils.py \
            || ! grep -qF 'async_add_executor_job(load_ca_into_hass_ssl_contexts,' custom_components/additional_ca/__init__.py; then
            echo "::error::This release no longer defines and calls load_ca_into_hass_ssl_contexts; port the in-place trust patch by hand."
            exit 1
          fi

      - name: "Set up Python"
        if: steps.upstream.outputs.new == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: "Unit tests"
        if: steps.upstream.outputs.new == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          python -m pytest test/unit/ -v --tb=short

      - name: "Hassfest"
        if: steps.upstream.outputs.new == 'true'
        uses: home-assistant/actions/hassfest@master

      - name: "Push"
        if: steps.upstream.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          git push origin HEAD:main

      - name: "Publish the release"
        if: steps.upstream.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          version="$TAG.1"
          yq -i -o json ".version=\"$version\"" custom_components/additional_ca/manifest.json
          (cd custom_components/additional_ca && zip -r "$GITHUB_WORKSPACE/additional_ca.zip" ./ -x "*__pycache__*")
          gh release create "$version" additional_ca.zip --target "$(git rev-parse HEAD)" --title "$version" \
            --notes "Upstream [$TAG](https://github.com/$UPSTREAM/releases/tag/$TAG) plus loading custom CAs into Home Assistant's SSL contexts at startup, so a Home Assistant update needs no second restart."
